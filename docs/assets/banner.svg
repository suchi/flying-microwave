<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Flying Microwave</title>
  <desc id="desc">A microwave oven flies across a night sky, flapping its open door like a wing, with a glowing turntable inside.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060812"/>
      <stop offset="0.55" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#1b1446"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inside" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="0.6" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#c46a1c"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#c9cfdc"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6eaf2"/>
      <stop offset="1" stop-color="#aeb6c8"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7df" stop-opacity="0"/>
      <stop offset="1" stop-color="#5ee7df" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7df"/>
      <stop offset="1" stop-color="#b490ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="190" cy="140" r="1" opacity="0.5"/>
    <circle cx="300" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="420" cy="300" r="1" opacity="0.4"/>
    <circle cx="520" cy="90" r="1.6" opacity="0.9"/>
    <circle cx="610" cy="250" r="1" opacity="0.5"/>
    <circle cx="700" cy="30" r="1.2" opacity="0.6"/>
    <circle cx="760" cy="320" r="1.4" opacity="0.6"/>
    <circle cx="1180" cy="50" r="1.3" opacity="0.7"/>
    <circle cx="1240" cy="190" r="1" opacity="0.5"/>
    <circle cx="1100" cy="320" r="1.2" opacity="0.6"/>
    <circle cx="140" cy="300" r="1.2" opacity="0.6"/>
    <circle cx="40" cy="200" r="1" opacity="0.4"/>
    <circle cx="660" cy="150" r="0.9" opacity="0.4"/>
  </g>

  <!-- Motion trail -->
  <g stroke="url(#trail)" stroke-linecap="round" fill="none">
    <path d="M840 262 L960 226" stroke-width="3"/>
    <path d="M860 292 L985 255" stroke-width="2" opacity="0.7"/>
    <path d="M870 232 L950 208" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- The microwave, tilted as it climbs to the upper right -->
  <g transform="translate(1065 172) rotate(-14) scale(0.86)">
    <ellipse cx="0" cy="10" rx="190" ry="120" fill="url(#glow)"/>
    <!-- Open door, swung out from the left hinge like a wing -->
    <g transform="translate(-110 -62)">
      <path d="M0 0 L-86 -58 L-86 66 L0 124 Z" fill="url(#door)" stroke="#8a93a8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-14 22 L-70 -14 L-70 54 L-14 90 Z" fill="#1d2440" opacity="0.85"/>
    </g>
    <!-- Body -->
    <rect x="-110" y="-62" width="220" height="124" rx="16" fill="url(#body)" stroke="#8a93a8" stroke-width="2"/>
    <!-- Cavity with light and turntable -->
    <rect x="-96" y="-48" width="140" height="96" rx="8" fill="url(#inside)"/>
    <ellipse cx="-26" cy="30" rx="50" ry="10" fill="#fff4dc" opacity="0.85"/>
    <ellipse cx="-26" cy="30" rx="30" ry="5" fill="#ffd38a"/>
    <!-- Control panel -->
    <rect x="56" y="-48" width="42" height="96" rx="6" fill="#2a3150"/>
    <rect x="62" y="-40" width="30" height="16" rx="3" fill="#0b1020"/>
    <text x="77" y="-28" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#5ee7df">12:00</text>
    <circle cx="77" cy="2" r="9" fill="#c9cfdc"/>
    <circle cx="77" cy="2" r="3" fill="#2a3150"/>
    <rect x="66" y="22" width="22" height="7" rx="3" fill="#5ee7df" opacity="0.8"/>
    <rect x="66" y="34" width="22" height="7" rx="3" fill="#b490ff" opacity="0.8"/>
  </g>

  <!-- Title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="88" y="168" font-size="76" font-weight="800" fill="#f4f6fb" letter-spacing="-1">Flying Microwave</text>
    <rect x="92" y="194" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="92" y="246" font-size="24" font-weight="400" fill="#b9c2d9">A screensaver for Windows where microwaves take flight</text>
  </g>
</svg>
