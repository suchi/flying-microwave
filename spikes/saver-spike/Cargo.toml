# Throwaway technical spike for S1, S3, S4 and S6 (see spikes/README.md).
# It is not product code: it lives outside the root workspace and nothing
# in the product may depend on it.
[package]
name = "saver-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Throwaway spike: screensaver /s, /p and diagnostic modes with winit and wgpu"

# Why: the root workspace excludes spikes/, so this empty table makes the
# crate its own workspace root (and keeps its own Cargo.lock).
[workspace]

# Everything below is Windows-only. On other hosts the crate has no
# dependencies and main only prints "Windows only".
[target.'cfg(windows)'.dependencies]
# Why: exact pins, because 0.x crates can break on minor updates.
# Why: default features are off so that only the Windows backends are built.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
# Why: dx12 is the default backend of the product, vulkan is only for the
# optional backend-vulkan.flag experiment. No wgsl: the spike draws no shaders.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan"] }
pollster = "=1.0.1"
# Why: wgpu reports the HRESULT of a failed swap chain call only through the
# log crate (wgpu-hal dx12 `configure`); the spike forwards it to its log file.
# Same version as already in Cargo.lock through wgpu. Why `package`: the
# spike has its own `log` module and `log!` macro, which the crate name would clash with.
log_crate = { package = "log", version = "=0.4.35" }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Keep the artifact small; the spike does not need debug info.
opt-level = 2
strip = true
