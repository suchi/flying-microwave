# Dependabot configuration.
#
# SECURITY: the `cooldown` blocks below are a supply-chain-attack defense.
# They delay update PRs until a new release has been public for a few days,
# giving the community time to detect malicious releases.
# Do NOT remove or disable them without the user's explicit approval
# (see the Security section in AGENTS.md).

version: 2
updates:
  # GitHub Actions — valid for any repository that has workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 8
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - "suchi"
    labels:
      - "dependencies"
    groups:
      non-majors:
        update-types:
          - "minor"
          - "patch"
  # Rust (Cargo workspace). The spikes/ projects are throwaway and not listed.
  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 8
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - "suchi"
    labels:
      - "dependencies"
    groups:
      # winit, wgpu and the egui family must be upgraded together because
      # eframe pins the winit and wgpu series it supports (R-05). In 0.x
      # crates a minor bump can be breaking, so group them by name, not by
      # update type. A dependency joins the first group that matches.
      gui-stack:
        patterns:
          - "winit"
          - "wgpu*"
          - "egui*"
          - "eframe"
          - "epaint*"
          - "emath"
          - "ecolor"
      non-majors:
        update-types:
          - "minor"
          - "patch"
