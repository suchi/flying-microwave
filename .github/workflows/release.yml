# Builds a tagged commit and creates a draft GitHub Release with the zip and
# its checksum (plan 0001, Phase 1 task 12, and section 7.3). The maintainer
# reviews the draft and publishes it; this workflow never publishes.
#
# Triggers: pushing a v* tag (only repository admins can create one, by the
# release-tags ruleset), or a manual run for an existing tag (for example the
# first release made with this workflow, or after a failed run).
#
# Security (same rules as ci.yml, plus):
# - the check and build jobs have a read-only token (the build job can also
#   read the artifacts of the run, for the SBOM); only the publish job can
#   write, and it runs no code from this repository or its dependencies, so a
#   compromised build dependency never gets a token that writes,
# - the publish job uses the gh CLI of the runner image instead of another
#   action (docs/incidents/0007: no new action whose publish date is unknown),
# - the tag input is used only through the TAG environment variable in
#   scripts, never expanded into a script with ${{ }}.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vX.Y.Z or vX.Y.Z-alpha.N)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  # Keep in step with ci.yml. The cooldown check below checks this version.
  CARGO_ABOUT_VERSION: 0.9.2

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      # Why two checkouts: the check scripts come from the workflow's own
      # commit, and the tagged commit is only read as data (its Cargo.toml,
      # CHANGELOG.md and Cargo.lock). A tag made before a script existed can
      # then still be released by a manual run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: tag
          fetch-depth: 0
          persist-credentials: false

      # The tag format, the Cargo.toml version and the CHANGELOG section. The
      # commit checked here is passed on, so that the later jobs use the same
      # commit even if the tag were moved meanwhile.
      - name: Check the tag and write the release notes
        id: tag
        run: |
          # Why: a manual run must use the reviewed workflow on main.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "手動実行はmainから起動する($GITHUB_REF から起動された)" >&2
            exit 1
          fi
          python3 -I -m unittest discover -s scripts
          python3 -I scripts/prepare_release.py "$TAG" --root tag --notes "$RUNNER_TEMP/release-notes.md"
          if ! git -C tag merge-base --is-ancestor HEAD origin/main; then
            echo "$TAG はmainの上にない" >&2
            exit 1
          fi
          echo "sha=$(git -C tag rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Same check as ci.yml (docs/incidents/0007).
      - name: Check dependency cooldown
        run: |
          tool="cargo-about-${CARGO_ABOUT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$tool.crate" "https://static.crates.io/crates/cargo-about/$tool.crate"
          tar -xzf "$RUNNER_TEMP/$tool.crate" -C "$RUNNER_TEMP" "$tool/Cargo.lock"
          python3 -I scripts/check_publish_age.py \
            --crate "cargo-about@${CARGO_ABOUT_VERSION}" \
            tag/Cargo.lock "$RUNNER_TEMP/$tool/Cargo.lock"

      # SPDX 2.3 SBOMs of the executable, one per target (ADR-0021). Made
      # here and not in the build jobs, so that the script comes from the
      # workflow's commit like the other checks, and runs on the Python of
      # this runner (the Python of the arm64 runner is not documented).
      # cargo only reads the tagged commit here (metadata and tree run no
      # build script). The creation time is the commit time, so the same
      # commit gives the same documents; the namespace is unique per
      # release, target and commit.
      - name: Install toolchain from rust-toolchain.toml
        working-directory: tag
        run: rustup toolchain install

      - name: SBOM
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          created=$(TZ=UTC0 git -C tag log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          version="${TAG#v}"
          mkdir -p "$RUNNER_TEMP/sbom"
          for pair in x64:x86_64-pc-windows-msvc arm64:aarch64-pc-windows-msvc; do
            arch="${pair%%:*}"
            target="${pair#*:}"
            python3 -I scripts/make_sbom.py --root tag --target "$target" --created "$created" \
              --namespace "https://github.com/$GITHUB_REPOSITORY/releases/$TAG/sbom/$arch/$SHA" \
              --out "$RUNNER_TEMP/sbom/FlyingMicrowave-$version-windows-$arch.spdx.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # x64 is the supported build. arm64 ships without guarantee and gets only
  # the automated checks of this job, on an arm64 runner (ADR-0016). A failure
  # of either fails the release; arm64 is never left out silently.
  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # actions: read is for downloading the SBOM artifact of this run.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Why: the arm64 runner is first used by the v0.1.0 tag (plan 0001,
      # D-23), and its image documentation does not list the Visual Studio
      # components. Show the tools a failure would depend on, so that one run
      # tells what is missing. ring (built by cargo-about) compiles its C code
      # with clang on Windows arm64 (ring 0.17.14, build.rs), so put the
      # LLVM of the image on PATH when clang is not there yet.
      - name: Show and prepare arm64 build tools
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          Write-Output "link.exe (arm64): $(& $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostarm64\arm64\link.exe')"
          Write-Output "rc.exe (arm64): $(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\arm64\rc.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)"
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang -and (Test-Path "$env:ProgramFiles\LLVM\bin\clang.exe")) {
            "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Output "clang: added $env:ProgramFiles\LLVM\bin to PATH"
          } else {
            Write-Output "clang: $($clang.Source)"
          }

      # Why no cache: a release is built from scratch (plan 0001, chapter 9).
      # Each runner builds and tests its own architecture natively.
      # The checks of this job are listed in the release notes for arm64
      # (scripts/prepare_release.py, arm64_notes): change both together.
      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Same check as ci.yml (ADR-0001, R-16).
      # Why native first: a cross tool (for example bin\HostX64\arm64) needs
      # the DLLs of the host directory on PATH (find-msvc-tools 0.1.15,
      # find_tools.rs). The native tools need nothing else; any other one is
      # a fallback, logged below.
      - name: Check DLL dependencies
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $native = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'Hostarm64\arm64' } else { 'Hostx64\x64' }
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\$native\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) {
            $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe' | Select-Object -First 1
          }
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          Write-Output "dumpbin: $dumpbin"
          $exe = 'target/${{ matrix.target }}/release/flying-microwave.exe'
          $out = & $dumpbin /nologo /dependents $exe
          $out | Write-Output
          if (-not ($out | Select-String -Pattern '(?i)\bKERNEL32\.dll\b')) { throw 'dumpbin output does not list KERNEL32.dll' }
          $bad = $out | Select-String -Pattern '(?i)\b(vcruntime|msvcp|concrt|vccorlib|ucrtbase)\w*\.dll\b|\bapi-ms-win-crt-'
          if ($bad) { throw "Dynamic C runtime dependency found: $bad" }
          # SEC-1: imports are resolved from System32 only (/DEPENDENTLOADFLAG:0x800, build.rs).
          $config = & $dumpbin /nologo /loadconfig $exe
          $flag = $config | Select-String -Pattern '(?i)\b(\w+)\s+Dependent Load Flag'
          $flag | Write-Output
          if (-not $flag -or [Convert]::ToInt32($flag.Matches[0].Groups[1].Value, 16) -ne 0x800) { throw 'Dependent Load Flag is not 0x800' }

      # Same check as ci.yml (plan 0002, T-1).
      - name: Check version information
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked --offline | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'flying-microwave').version
          if (-not $version) { throw 'version of flying-microwave was not found' }
          if ("v$version" -ne $env:TAG) { throw "version $version does not match $env:TAG" }
          $exe = Resolve-Path 'target/${{ matrix.target }}/release/flying-microwave.exe'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $info | Format-List ProductName, FileDescription, ProductVersion, FileVersion, IsPreRelease | Out-String | Write-Output
          if ($info.ProductVersion -ne $version) { throw "ProductVersion is '$($info.ProductVersion)', expected '$version'" }
          if ($info.FileVersion -ne $version) { throw "FileVersion is '$($info.FileVersion)', expected '$version'" }
          if ($info.ProductName -ne 'Flying Microwave') { throw "ProductName is '$($info.ProductName)'" }
          if ($info.IsPreRelease -ne $version.Contains('-')) { throw "IsPreRelease is $($info.IsPreRelease) for $version" }
          $numeric = ($version -split '-')[0] + '.0'
          $actual = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
          if ($actual -ne $numeric) { throw "numeric file version is $actual, expected $numeric" }
          $actual = '{0}.{1}.{2}.{3}' -f $info.ProductMajorPart, $info.ProductMinorPart, $info.ProductBuildPart, $info.ProductPrivatePart
          if ($actual -ne $numeric) { throw "numeric product version is $actual, expected $numeric" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/flying-microwave.exe' package/FlyingMicrowave.scr
          Copy-Item LICENSE package/LICENSE.txt
          Copy-Item packaging/windows/README.md package/README.md

      # The SBOMs are made by the check job (scripts/make_sbom.py). Why gh
      # and not another action: same as the publish job (docs/incidents/0007).
      # The token is given to this step only, so the other steps (which run
      # the code of the dependencies) never see it.
      - name: SBOM
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download $env:GITHUB_RUN_ID --name sbom --dir sbom
          if ($LASTEXITCODE -ne 0) { throw 'gh run download failed' }
          $version = $env:TAG.Substring(1)
          Copy-Item "sbom/FlyingMicrowave-$version-windows-$env:ARCH.spdx.json" package/ -ErrorAction Stop

      # Same steps as the manual run of ci.yml (plan 0002, T-2).
      - name: License notices
        shell: pwsh
        run: |
          cargo install --locked --features cli --version $env:CARGO_ABOUT_VERSION cargo-about
          cargo about generate --locked --fail -o package/THIRD-PARTY-LICENSES.txt about.hbs
          if ($LASTEXITCODE -ne 0) { throw 'cargo about failed' }
          $left = Select-String -Path package/THIRD-PARTY-LICENSES.txt -Pattern '<(copyright holders|year|owner|name of author)>'
          if ($left) { throw "Unfilled license placeholders: $left" }

      # The zip name follows ADR-0016 (FlyingMicrowave-<version>-windows-<arch>.zip).
      - name: Zip
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $version = $env:TAG.Substring(1)
          Compress-Archive -Path package/* -DestinationPath "dist/FlyingMicrowave-$version-windows-$env:ARCH.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create draft release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # SHA256SUMS.txt is made here, so that it covers the zips of every
      # target (plan 0002, T-3).
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          # The tag must still point at the commit that was checked and built.
          actual=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [[ "$actual" != "$SHA" ]]; then
            echo "$TAG が、検査したコミット($SHA)ではなく $actual を指している" >&2
            exit 1
          fi
          gh run download "$GITHUB_RUN_ID" --name release-x64 --dir dist
          gh run download "$GITHUB_RUN_ID" --name release-arm64 --dir dist
          # Both zips must be there: arm64 is never left out (ADR-0016).
          version="${TAG#v}"
          for arch in x64 arm64; do
            if [[ ! -f "dist/FlyingMicrowave-$version-windows-$arch.zip" ]]; then
              echo "FlyingMicrowave-$version-windows-$arch.zip がない" >&2
              exit 1
            fi
          done
          gh run download "$GITHUB_RUN_ID" --name release-notes --dir notes
          (cd dist && sha256sum -- *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # A release or draft for the tag must not exist yet. To make it
          # again, the maintainer deletes the old draft first (plan 0001, 7.3).
          # Why: only "release not found" means there is none; any other
          # failure (authentication, rate limit) must not be taken as absent.
          if err=$(gh release view "$TAG" 2>&1 > /dev/null); then
            echo "$TAG のリリースか下書きが、すでにある" >&2
            exit 1
          elif [[ "$err" != *"release not found"* ]]; then
            echo "$TAG のリリースがあるかを確かめられない: $err" >&2
            exit 1
          fi
          args=(--draft --verify-tag --title "Flying Microwave $TAG" --notes-file notes/release-notes.md)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" dist/*
