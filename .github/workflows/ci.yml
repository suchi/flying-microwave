# Continuous integration for the Flying Microwave workspace.
#
# Security (docs/plans/0001-initial-implementation-plan.md, R-08):
# - third-party actions are pinned by full commit SHA (Dependabot updates them),
# - the workflow token is read-only and checkout does not persist credentials,
# - every cargo command uses --locked so Cargo.lock is not changed silently.
#
# Artifacts: every run keeps FlyingMicrowave.scr for checks on real hardware.
# A manual run (workflow_dispatch) builds from scratch without the cache and
# adds the license notices, for a pre-release (plan 0001, section 7.3).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only, so every push to main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The version of cargo-about installed by the manual run. The cooldown check
  # below also checks this version and its Cargo.lock (docs/incidents/0007).
  CARGO_ABOUT_VERSION: 0.9.2

jobs:
  linux:
    name: Linux (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Supply-chain defense: every crates.io version in the lock files, and the
      # tools installed below, must have been public for at least 7 days, the
      # same cooldown as .github/dependabot.yml. Local cargo runs are not
      # covered by Dependabot's cooldown (docs/incidents/0007).
      - name: Check dependency cooldown
        run: |
          python3 -I -m unittest discover -s scripts
          tool="cargo-about-${CARGO_ABOUT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$tool.crate" "https://static.crates.io/crates/cargo-about/$tool.crate"
          tar -xzf "$RUNNER_TEMP/$tool.crate" -C "$RUNNER_TEMP" "$tool/Cargo.lock"
          python3 -I scripts/check_publish_age.py \
            --crate "cargo-about@${CARGO_ABOUT_VERSION}" \
            Cargo.lock spikes/saver-spike/Cargo.lock spikes/settings-spike/Cargo.lock \
            "$RUNNER_TEMP/$tool/Cargo.lock"

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Caches ~/.cargo and the build artifacts of dependencies (ADR-0017).
      # Must come after the toolchain install: the rustc version is part of the key.
      # The default key ignores the root Cargo.toml (profiles, workspace
      # dependency features), so its hash is added here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Why: the Windows job builds x64 only, so this is the only CI check
      # that the arm64 target still compiles (ADR-0016).
      - name: Type-check Windows targets
        run: |
          cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
          cargo check --workspace --all-targets --locked --target aarch64-pc-windows-msvc

  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Why: arm64 is shipped without guarantee and built only by the
        # release workflow (ADR-0016).
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # The default key includes neither the matrix target nor the root
      # Cargo.toml, so add both: the target keeps caches for different
      # targets apart (ADR-0017).
      # Why: a manual run makes pre-release artifacts, so it never restores a
      # cache (same rule as the release workflow, plan 0001 chapter 9).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name != 'workflow_dispatch'
        with:
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The executable must not depend on the Visual C++ runtime (ADR-0001, R-16).
      - name: Check DLL dependencies
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          $exe = 'target/${{ matrix.target }}/release/flying-microwave.exe'
          $out = & $dumpbin /nologo /dependents $exe
          $out | Write-Output
          if (-not ($out | Select-String -Pattern '(?i)\bKERNEL32\.dll\b')) { throw 'dumpbin output does not list KERNEL32.dll' }
          $bad = $out | Select-String -Pattern '(?i)\b(vcruntime|msvcp|concrt|vccorlib|ucrtbase)\w*\.dll\b|\bapi-ms-win-crt-'
          if ($bad) { throw "Dynamic C runtime dependency found: $bad" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/flying-microwave.exe' dist/FlyingMicrowave.scr
          Copy-Item LICENSE dist/LICENSE.txt

      # Why: install from source with --locked; crates.io checksums are
      # verified by Cargo (plan 0002, T-2). Manual runs only, as it takes minutes.
      - name: License notices
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          cargo install --locked --features cli --version $env:CARGO_ABOUT_VERSION cargo-about
          cargo about generate --locked --fail -o dist/THIRD-PARTY-LICENSES.txt about.hbs
          if ($LASTEXITCODE -ne 0) { throw 'cargo about failed' }
          # Unfilled SPDX placeholders are not caught by the exit code (T-2).
          # Why: angle brackets only. "Copyright [yyyy] [name of copyright
          # owner]" is part of the Apache-2.0 text itself (its appendix).
          $left = Select-String -Path dist/THIRD-PARTY-LICENSES.txt -Pattern '<(copyright holders|year|owner|name of author)>'
          if ($left) { throw "Unfilled license placeholders: $left" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flying-microwave-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 7 }}

      # winit, wgpu and the egui family must be upgraded together (R-05).
      - name: Check duplicate GUI crates
        shell: pwsh
        run: |
          $dups = cargo tree --locked --duplicates --depth 0 --edges normal --prefix none --target ${{ matrix.target }} 2>$null
          $dups | Write-Output
          $gui = $dups | Select-String -Pattern '^(winit|wgpu[\w-]*|egui[\w-]*|eframe|epaint[\w-]*|emath|ecolor) v'
          if ($gui) { throw "Duplicate GUI crates found: $gui" }
