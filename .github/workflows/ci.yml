# Continuous integration for the Flying Microwave workspace.
#
# Security (docs/plans/0001-initial-implementation-plan.md, R-08):
# - third-party actions are pinned by full commit SHA (Dependabot updates them),
# - the workflow token is read-only and checkout does not persist credentials,
# - every cargo command uses --locked so Cargo.lock is not changed silently.
#
# Artifacts: every run keeps FlyingMicrowave.scr for checks on real hardware,
# except a pull request from a fork (plan 0005, D-47, N-4).
# A manual run (workflow_dispatch) builds from scratch without the cache and
# adds the license notices, for checks on real hardware. Releases are built
# by release.yml (plan 0001, section 7.3).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only, so every push to main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The version of cargo-about installed by the manual run. The cooldown check
  # below also checks this version and its Cargo.lock (docs/incidents/0007).
  CARGO_ABOUT_VERSION: 0.9.2

jobs:
  linux:
    name: Linux (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every Claude Code hook in .claude/settings.json must be executable and
      # must stop a sample input when started exactly as registered: a hook
      # that cannot start is a non-blocking error, so a guard fails silently
      # (docs/incidents/0009).
      - name: Check Claude Code hooks
        run: python3 -I scripts/check_hooks.py

      # Supply-chain defense: every crates.io version in the lock files, and the
      # tools installed below, must have been public for at least 7 days, the
      # same cooldown as .github/dependabot.yml. Local cargo runs are not
      # covered by Dependabot's cooldown (docs/incidents/0007).
      - name: Check dependency cooldown
        run: |
          python3 -I -m unittest discover -s scripts
          tool="cargo-about-${CARGO_ABOUT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$tool.crate" "https://static.crates.io/crates/cargo-about/$tool.crate"
          tar -xzf "$RUNNER_TEMP/$tool.crate" -C "$RUNNER_TEMP" "$tool/Cargo.lock"
          python3 -I scripts/check_publish_age.py \
            --crate "cargo-about@${CARGO_ABOUT_VERSION}" \
            Cargo.lock \
            "$RUNNER_TEMP/$tool/Cargo.lock"

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Caches ~/.cargo and the build artifacts of dependencies (ADR-0017).
      # Must come after the toolchain install: the rustc version is part of the key.
      # The default key ignores the root Cargo.toml (profiles, workspace
      # dependency features), so its hash is added here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Why: arm64 is not supported for now (ADR-0022, issue #44), but the
      # code is kept compiling for it, so that supporting it stays a small step.
      - name: Type-check Windows targets
        run: |
          cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
          cargo check --workspace --all-targets --locked --target aarch64-pc-windows-msvc

  windows:
    name: Windows (${{ matrix.target }})
    # Why: the Windows job builds the artifacts (and, in a manual run, installs
    # cargo-about), so it must not start before the dependency cooldown check
    # in the Linux job has passed (docs/incidents/0007). The check stays inside
    # the required Linux job: a separate failing job would make the required
    # jobs "skipped", which GitHub counts as passing.
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Why: only the x64 build is shipped for now (ADR-0022).
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Why: the scripts also run on the maintainer's Windows machine
      # (onboarding, section 5.1), and a failure there must show up in every
      # PR (docs/incidents/0012).
      - name: Script tests
        run: python -I -m unittest discover -s scripts

      # The default key includes neither the matrix target nor the root
      # Cargo.toml, so add both: the target keeps caches for different
      # targets apart (ADR-0017).
      # Why: a manual run makes artifacts that people run, so it never
      # restores a cache (same rule as release.yml, plan 0001 chapter 9).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name != 'workflow_dispatch'
        with:
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Starts the built executable in each mode and checks that it starts
      # and ends as a screensaver must (plan 0003, crates/smoke). Rendering
      # uses whatever adapter the runner has (WARP without a GPU).
      - name: Smoke test
        # Every wait of the test has its own limit; this catches a hang of the test itself.
        timeout-minutes: 5
        run: target/${{ matrix.target }}/release/flying-microwave-smoke.exe target/${{ matrix.target }}/release/flying-microwave.exe

      # The executable must not depend on the Visual C++ runtime (ADR-0001, R-16).
      - name: Check DLL dependencies
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          $exe = 'target/${{ matrix.target }}/release/flying-microwave.exe'
          $out = & $dumpbin /nologo /dependents $exe
          $out | Write-Output
          if (-not ($out | Select-String -Pattern '(?i)\bKERNEL32\.dll\b')) { throw 'dumpbin output does not list KERNEL32.dll' }
          $bad = $out | Select-String -Pattern '(?i)\b(vcruntime|msvcp|concrt|vccorlib|ucrtbase)\w*\.dll\b|\bapi-ms-win-crt-'
          if ($bad) { throw "Dynamic C runtime dependency found: $bad" }
          # SEC-1: imports are resolved from System32 only (/DEPENDENTLOADFLAG:0x800, build.rs).
          $config = & $dumpbin /nologo /loadconfig $exe
          $flag = $config | Select-String -Pattern '(?i)\b(\w+)\s+Dependent Load Flag'
          $flag | Write-Output
          if (-not $flag -or [Convert]::ToInt32($flag.Matches[0].Groups[1].Value, 16) -ne 0x800) { throw 'Dependent Load Flag is not 0x800' }

      # The version information from build.rs must be in the executable
      # (plan 0002, T-1). Without it the resource compiler was not run.
      - name: Check version information
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked --offline | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'flying-microwave').version
          if (-not $version) { throw 'version of flying-microwave was not found' }
          $exe = Resolve-Path 'target/${{ matrix.target }}/release/flying-microwave.exe'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $info | Format-List ProductName, FileDescription, ProductVersion, FileVersion, IsPreRelease | Out-String | Write-Output
          if ($info.ProductVersion -ne $version) { throw "ProductVersion is '$($info.ProductVersion)', expected '$version'" }
          if ($info.FileVersion -ne $version) { throw "FileVersion is '$($info.FileVersion)', expected '$version'" }
          if ($info.ProductName -ne 'Flying Microwave') { throw "ProductName is '$($info.ProductName)'" }
          if ($info.IsPreRelease -ne $version.Contains('-')) { throw "IsPreRelease is $($info.IsPreRelease) for $version" }
          # The numeric version is major.minor.patch.0 (build.rs).
          $numeric = ($version -split '-')[0] + '.0'
          $actual = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
          if ($actual -ne $numeric) { throw "numeric file version is $actual, expected $numeric" }
          $actual = '{0}.{1}.{2}.{3}' -f $info.ProductMajorPart, $info.ProductMinorPart, $info.ProductBuildPart, $info.ProductPrivatePart
          if ($actual -ne $numeric) { throw "numeric product version is $actual, expected $numeric" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/flying-microwave.exe' dist/FlyingMicrowave.scr
          Copy-Item LICENSE dist/LICENSE.txt

      # Why: install from source with --locked; crates.io checksums are
      # verified by Cargo (plan 0002, T-2). Manual runs only, as it takes minutes.
      - name: License notices
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          cargo install --locked --features cli --version $env:CARGO_ABOUT_VERSION cargo-about
          cargo about generate --locked --fail -o dist/THIRD-PARTY-LICENSES.txt about.hbs
          if ($LASTEXITCODE -ne 0) { throw 'cargo about failed' }
          # Unfilled SPDX placeholders are not caught by the exit code (T-2).
          # Why: angle brackets only. "Copyright [yyyy] [name of copyright
          # owner]" is part of the Apache-2.0 text itself (its appendix).
          $left = Select-String -Path dist/THIRD-PARTY-LICENSES.txt -Pattern '<(copyright holders|year|owner|name of author)>'
          if ($left) { throw "Unfilled license placeholders: $left" }

      # Why the condition: a pull request from a fork builds code an outside
      # person wrote, and its artifact would be offered under the same name as
      # the maintainer's builds (plan 0005, D-47, N-4; docs/reviews/0006).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: flying-microwave-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 7 }}

      # winit, wgpu and the egui family must be upgraded together (R-05).
      - name: Check duplicate GUI crates
        shell: pwsh
        run: |
          $dups = cargo tree --locked --duplicates --depth 0 --edges normal --prefix none --target ${{ matrix.target }} 2>$null
          $dups | Write-Output
          $gui = $dups | Select-String -Pattern '^(winit|wgpu[\w-]*|egui[\w-]*|eframe|epaint[\w-]*|emath|ecolor) v'
          if ($gui) { throw "Duplicate GUI crates found: $gui" }
