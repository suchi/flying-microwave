# Builds the Phase 0 technical spikes on Windows for x64. Pull requests use a
# build cache, to check that the spikes still build. Manual runs
# (workflow_dispatch) build from scratch and publish the result as build
# artifacts, so the maintainer can run them on Windows 11
# (spikes/README.md, ADR-0017).
#
# Security: same rules as ci.yml (actions pinned by commit SHA, read-only
# token, no persisted credentials, --locked).

name: Spikes

on:
  pull_request:
    paths:
      - "spikes/**"
      - ".github/workflows/spikes.yml"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  # Why: cancel superseded runs on pull requests only. A manual run builds the
  # artifacts the maintainer runs on real hardware; cancelling it threw away a
  # finished build (docs/incidents/0003). A new manual run now waits for the
  # running one; only an older *waiting* run is replaced by the newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build spikes (${{ matrix.target }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Why: the spikes are not tested on arm64 devices, so arm64 is not
        # built, not even by manual runs (ADR-0016, ADR-0017).
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Caches ~/.cargo and the build artifacts of dependencies (ADR-0017).
      # Must come after the toolchain install: the rustc version is part of the key.
      # Pull requests only: manual runs build from scratch, because their
      # artifacts are run by hand on real hardware and cache contents are not
      # verified. The matrix target is not part of the default key, so add it.
      # Each spike's own Cargo.toml (its workspace root and only member) is
      # already hashed into the default key, [profile] included.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name == 'pull_request'
        with:
          key: ${{ matrix.target }}
          workspaces: |
            spikes/saver-spike -> target
            spikes/settings-spike -> target

      - name: Build
        shell: pwsh
        run: |
          foreach ($spike in 'saver-spike', 'settings-spike') {
            cargo build --release --locked --manifest-path "spikes/$spike/Cargo.toml" --target ${{ matrix.target }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($spike in 'saver-spike', 'settings-spike') {
            $exe = "spikes/$spike/target/${{ matrix.target }}/release/$spike.exe"
            Copy-Item $exe "dist/$spike.exe"
            Copy-Item $exe "dist/$spike.scr"
          }
          Copy-Item spikes/README.md dist/README.md

      # Security: artifacts are unsigned executables that the maintainer runs
      # by hand, so publish them only from manual runs (which need write
      # access and do not restore caches), never from pull requests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: spikes-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # Why: this step only checks whether GUI smoke tests can run on hosted
      # runners at all (Phase 0, task 8). Its outcome is recorded in
      # docs/research/spike-results.md and must not block the spike build.
      - name: Self-test on the hosted runner (feasibility check)
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/saver-spike.exe -ArgumentList '--self-test' -PassThru -Wait
          Get-Content (Join-Path $env:TEMP 'flying-microwave-spike.log') -ErrorAction SilentlyContinue | Write-Output
          if ($p.ExitCode -ne 0) { throw "saver-spike --self-test exited with code $($p.ExitCode)" }
