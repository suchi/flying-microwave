<svg xmlns="http://www.w3.org/2000/svg" width="702" height="606" viewBox="0 0 702 606">
  <!-- Food that flies besides the microwaves (plan 0005, D-16 (1) and D-17). One SVG unit is one pixel of the atlas. Face positions are fixed by crates/app/src/model.rs. Only safe uses are drawn (guideline G-2). -->
  <!-- boxed meal (bento), top seen from above through the clear lid; its bottom edge meets the front: 256 x 192 at (0, 0) -->
  <g transform="translate(0 0)">
    <rect width="256" height="192" fill="#1d1f24"/>
    <rect x="10" y="10" width="236" height="172" rx="6" fill="#2a2d33"/>
    <rect x="16" y="16" width="120" height="160" rx="6" fill="#f4f1e8"/>
    <circle cx="76" cy="96" r="9" fill="#c0392b"/>
    <rect x="144" y="16" width="96" height="76" rx="6" fill="#f08a4b"/>
    <rect x="152" y="30" width="80" height="10" rx="4" fill="#f6b78a"/>
    <rect x="152" y="52" width="80" height="10" rx="4" fill="#f6b78a"/>
    <rect x="144" y="100" width="96" height="76" rx="6" fill="#3f8f3a"/>
    <circle cx="170" cy="126" r="12" fill="#5fb055"/>
    <circle cx="212" cy="150" r="14" fill="#f2c94c"/>
    <rect x="10" y="10" width="236" height="60" rx="6" fill="#ffffff" opacity="0.12"/>
  </g>
  <!-- bento, the four sides (tray with the lid edge at the top): 256 x 64 at (266, 0) -->
  <g transform="translate(266 0)">
    <rect width="256" height="64" fill="#1d1f24"/>
    <rect width="256" height="10" fill="#d9dde3" opacity="0.6"/>
  </g>
  <!-- bento, bottom: 64 x 64 at (532, 0) -->
  <g transform="translate(532 0)">
    <rect width="64" height="64" fill="#15171b"/>
  </g>
  <!-- popcorn bag, front: 192 x 256 at (0, 202) -->
  <g transform="translate(0 202)">
    <rect width="192" height="256" fill="#f6f1e6"/>
    <rect x="0" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="32" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="64" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="96" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="128" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="160" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="36" y="78" width="120" height="100" rx="14" fill="#f6f1e6"/>
    <circle cx="72" cy="118" r="14" fill="#f5d36b"/>
    <circle cx="96" cy="108" r="16" fill="#f5d36b"/>
    <circle cx="120" cy="120" r="14" fill="#f5d36b"/>
    <circle cx="84" cy="140" r="15" fill="#f5d36b"/>
    <circle cx="108" cy="142" r="15" fill="#f5d36b"/>
    <circle cx="96" cy="128" r="13" fill="#f5d36b"/>
    <rect x="0" y="0" width="192" height="18" fill="#c23a3a"/>
  </g>
  <!-- popcorn bag, back: 192 x 256 at (202, 202) -->
  <g transform="translate(202 202)">
    <rect width="192" height="256" fill="#f6f1e6"/>
    <rect x="0" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="32" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="64" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="96" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="128" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="160" y="0" width="16" height="256" fill="#d64545"/>
    <rect x="40" y="96" width="112" height="64" rx="6" fill="#f6f1e6"/>
    <rect x="52" y="112" width="88" height="6" rx="3" fill="#b8b2a6"/>
    <rect x="52" y="128" width="64" height="6" rx="3" fill="#b8b2a6"/>
    <rect x="0" y="0" width="192" height="18" fill="#c23a3a"/>
  </g>
  <!-- popcorn bag, edges: 32 x 32 at (404, 202) -->
  <g transform="translate(404 202)">
    <rect width="32" height="32" fill="#e9e2d2"/>
  </g>
  <!-- mug, side wrapped around the cylinder (its top edge is the rim): 256 x 128 at (446, 202) -->
  <g transform="translate(446 202)">
    <rect width="256" height="128" fill="#4fa3a5"/>
    <rect y="40" width="256" height="14" fill="#f2efe8"/>
    <rect y="0" width="256" height="6" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- mug, top seen from above: the rim and the warm drink: 128 x 128 at (446, 340) -->
  <g transform="translate(446 340)">
    <rect width="128" height="128" fill="#4fa3a5"/>
    <circle cx="64" cy="64" r="58" fill="#3b8385"/>
    <circle cx="64" cy="64" r="52" fill="#7a4a2a"/>
    <circle cx="52" cy="52" r="14" fill="#a26a40" opacity="0.6"/>
  </g>
  <!-- mug, handle: 16 x 16 at (584, 340) -->
  <g transform="translate(584 340)">
    <rect width="16" height="16" fill="#4fa3a5"/>
  </g>
  <!-- mug, bottom: 64 x 64 at (610, 340) -->
  <g transform="translate(610 340)">
    <rect width="64" height="64" fill="#3b8385"/>
    <circle cx="32" cy="32" r="22" fill="none" stroke="#2c6a6b" stroke-width="4"/>
  </g>
  <!-- steamed bun, side wrapped around the dome (its top edge is near the top): 256 x 96 at (0, 478) -->
  <g transform="translate(0 478)">
    <rect width="256" height="96" fill="#f7f3ea"/>
    <rect y="0" width="256" height="30" fill="#ffffff"/>
    <rect y="78" width="256" height="18" fill="#ece5d6"/>
  </g>
  <!-- steamed bun, top seen from above with the pleats: 128 x 128 at (266, 478) -->
  <g transform="translate(266 478)">
    <rect width="128" height="128" fill="#ffffff"/>
    <path d="M64 64 L64 14" stroke="#e3dccb" stroke-width="4" stroke-linecap="round" transform="rotate(0 64 64)"/>
    <path d="M64 64 L64 14" stroke="#e3dccb" stroke-width="4" stroke-linecap="round" transform="rotate(45 64 64)"/>
    <path d="M64 64 L64 14" stroke="#e3dccb" stroke-width="4" stroke-linecap="round" transform="rotate(90 64 64)"/>
    <path d="M64 64 L64 14" stroke="#e3dccb" stroke-width="4" stroke-linecap="round" transform="rotate(135 64 64)"/>
    <path d="M64 64 L64 14" stroke="#e3dccb" stroke-width="4" stroke-linecap="round" transform="rotate(180 64 64)"/>
    <path d="M64 64 L64 14" stroke="#e3dccb" stroke-width="4" stroke-linecap="round" transform="rotate(225 64 64)"/>
    <path d="M64 64 L64 14" stroke="#e3dccb" stroke-width="4" stroke-linecap="round" transform="rotate(270 64 64)"/>
    <path d="M64 64 L64 14" stroke="#e3dccb" stroke-width="4" stroke-linecap="round" transform="rotate(315 64 64)"/>
    <circle cx="64" cy="64" r="10" fill="#efe8d8"/>
  </g>
  <!-- steamed bun, bottom on its paper: 64 x 64 at (404, 478) -->
  <g transform="translate(404 478)">
    <rect width="64" height="64" fill="#efe3c8"/>
  </g>
</svg>
