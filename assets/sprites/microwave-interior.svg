<svg xmlns="http://www.w3.org/2000/svg" width="430" height="256" viewBox="0 0 430 256">
  <!-- Microwave interior (unlit by the scene light). Face positions are fixed by crates/app/src/model.rs. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.55" stop-color="#ff9a3c"/><stop offset="1" stop-color="#7a3410"/></radialGradient>
  </defs>
  <!-- lit cavity walls: 128 x 128 at (0, 0) -->
  <g transform="translate(0 0)">
    <rect width="128" height="128" fill="url(#glow)"/>
  </g>
  <!-- turntable plate seen from above, opaque everywhere: 256 x 256 at (140, 0) -->
  <g transform="translate(140 0)">
    <rect width="256" height="256" fill="#e8a060"/>
    <circle cx="128" cy="128" r="124" fill="#fff4dc" stroke="#c46a26" stroke-width="5"/>
    <circle cx="128" cy="128" r="84" fill="none" stroke="#e0c49a" stroke-width="3"/>
    <rect x="122" y="10" width="12" height="40" rx="6" fill="#d9a46a" transform="rotate(0 128 128)"/>
    <rect x="122" y="10" width="12" height="40" rx="6" fill="#d9a46a" transform="rotate(120 128 128)"/>
    <rect x="122" y="10" width="12" height="40" rx="6" fill="#d9a46a" transform="rotate(240 128 128)"/>
  </g>
  <!-- color of a lit LED segment: 10 x 10 at (410, 0) -->
  <g transform="translate(410 0)">
    <rect width="10" height="10" fill="#5ee7df"/>
  </g>
</svg>
