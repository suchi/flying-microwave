[package]
name = "flying-microwave-smoke"
description = "Smoke test of the built Flying Microwave screensaver (plan 0003)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The smoke test drives the real executable on Windows only. On other hosts
# the binary builds without these, so the workspace can be checked on Linux.
[target.'cfg(windows)'.dependencies]
# Why: the same exact version as crates/app; no new dependency (plan 0003, N-01).
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
