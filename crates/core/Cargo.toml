[package]
name = "flying-microwave-core"
description = "Platform-independent logic for the Flying Microwave screensaver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Why: the settings file is TOML read and written with serde (ADR-0004; plan
# 0004, D-3). Both are pure Rust with no OS dependency, so `core::config` can
# be tested on any host (ADR-0009). Exact pins at the versions already in
# Cargo.lock (plan 0004, D-3).
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.2.1", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
