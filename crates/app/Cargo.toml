[package]
name = "flying-microwave"
description = "Flying Microwave screensaver executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flying-microwave-core = { path = "../core" }

# The screensaver itself is Windows only (ADR-0022). On other hosts the
# binary builds without these, so the workspace can be checked on Linux.
[target.'cfg(windows)'.dependencies]
# Why: exact pins, because 0.x crates can break on minor updates. The versions
# are the ones the technical spikes ran on real hardware (Phase 0, task 7;
# docs/research/spike-results.md).
# Why: default features are off so that only the Windows backend is built.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
# Why: DX12 only (ADR-0002). wgpu-core always builds its WGSL front end on
# native targets; the "wgsl" feature only lets the app hand it the WGSL source
# of the mesh shader (it adds no crate to Cargo.lock).
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
pollster = "=1.0.1"
# Why: the face images of the microwave are SVG files rasterized at startup
# (ADR-0026). Default features are off: the images use no text and no
# embedded images, so the font database and the image decoders are left out.
resvg = { version = "=0.50.0", default-features = false }
# Why: wgpu reports the reason of a failed swap chain call (the HRESULT) only
# through the log crate (wgpu-hal dx12 `configure`), so warnings and errors
# are forwarded to the diagnostic log. Already in Cargo.lock through wgpu.
# Why `package`: the app has its own `log` module and `log!` macro.
log_crate = { package = "log", version = "=0.4.34" }
# Why these eframe features (plan 0004, D-2; the same as the settings spike of
# Phase 0, which ran on real hardware with this wgpu and winit):
# - wgpu_no_default_features: the wgpu renderer (ADR-0003) without the other
#   wgpu backends. DX12 comes from the wgpu dependency above.
# - not default_fonts: its fonts are not OSI licensed; a system font is
#   loaded at runtime instead (plan 0004, E-5).
# - not accesskit, clipboard, links: off, decided in ADR-0024 (E-5); screen
#   reader support is reviewed again before v1.0.0.
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Win32_Security: CreateMutexW (single instance) takes SECURITY_ATTRIBUTES.
    "Win32_Security",
    # Win32_System_Com: CoTaskMemFree for the path from SHGetKnownFolderPath.
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    # Win32_System_Power and Win32_System_SystemServices: the display state
    # (PowerSettingRegisterNotification, GUID_SESSION_DISPLAY_STATUS) for N-14
    # (plan 0005, D-8). powrprof.dll is in System32 (SEC-1).
    "Win32_System_Power",
    "Win32_System_SystemServices",
    # Win32_System_SystemInformation: GetLocalTime (kernel32.dll) for the LED
    # clock (plan 0005, F-06 and D-16).
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # Win32_UI_Input_KeyboardAndMouse: EnableWindow for the settings owner (F-03).
    "Win32_UI_Input_KeyboardAndMouse",
    # Win32_UI_Shell: SHGetKnownFolderPath for the settings file (plan 0004, D-1).
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Why: build time only; compiles the .rc file into the executable on Windows
# and does nothing on other hosts (plan 0002, T-1).
[build-dependencies]
embed-resource = "=3.0.12"

[lints]
workspace = true
