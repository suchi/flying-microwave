[package]
name = "flying-microwave"
description = "Flying Microwave screensaver executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flying-microwave-core = { path = "../core" }

# The screensaver itself is Windows only (ADR-0006). On other hosts the
# binary builds without these, so the workspace can be checked on Linux.
[target.'cfg(windows)'.dependencies]
# Why: exact pins, because 0.x crates can break on minor updates. The versions
# are the ones the technical spikes ran on real hardware (Phase 0, task 7).
# Why: default features are off so that only the Windows backend is built.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
# Why: DX12 only (ADR-0002). wgpu always builds its WGSL front end on native
# targets (wgpu-core's "wgsl" feature), but the app uses no shader yet: the
# placeholder sprite is drawn by copying solid rectangles.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12"] }
pollster = "=1.0.1"
# Why: wgpu reports the reason of a failed swap chain call (the HRESULT) only
# through the log crate (wgpu-hal dx12 `configure`), so warnings and errors
# are forwarded to the diagnostic log. Already in Cargo.lock through wgpu.
# Why `package`: the app has its own `log` module and `log!` macro.
log_crate = { package = "log", version = "=0.4.34" }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Win32_Security: CreateMutexW (single instance) takes SECURITY_ATTRIBUTES.
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Why: build time only; compiles the .rc file into the executable on Windows
# and does nothing on other hosts (plan 0002, T-1).
[build-dependencies]
embed-resource = "=3.0.12"

[lints]
workspace = true
