<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Placeholder application icon (plan 0001, Phase 1 task 10). Same
       motif and colors as docs/assets/banner.svg. Final artwork: Phase 3. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#2a1d66"/>
    </linearGradient>
    <radialGradient id="inside" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="0.6" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#d0731f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#c3cad9"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3b8"/>
      <stop offset="1" stop-color="#e6eaf2"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="46" cy="52" r="4" opacity="0.8"/>
    <circle cx="208" cy="40" r="3" opacity="0.6"/>
    <circle cx="214" cy="214" r="3.5" opacity="0.5"/>
  </g>
  <g transform="translate(150 138) rotate(-12) scale(0.8)">
    <!-- Open door swung out from the left hinge like a wing -->
    <path d="M-84 -50 L-150 -112 L-150 -14 L-84 54 Z" fill="url(#door)" stroke="#6f7891" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-96 -24 L-138 -64 L-138 -18 L-96 26 Z" fill="#1d2440" opacity="0.85"/>
    <!-- Body -->
    <rect x="-84" y="-54" width="168" height="108" rx="16" fill="url(#body)" stroke="#6f7891" stroke-width="6"/>
    <!-- Cavity -->
    <rect x="-70" y="-40" width="104" height="80" rx="8" fill="url(#inside)"/>
    <!-- Control panel -->
    <rect x="42" y="-40" width="30" height="80" rx="6" fill="#2a3150"/>
    <rect x="47" y="-32" width="20" height="12" rx="3" fill="#5ee7df"/>
    <circle cx="57" cy="4" r="8" fill="#c9cfdc"/>
    <rect x="47" y="22" width="20" height="8" rx="3" fill="#b490ff"/>
  </g>
</svg>
