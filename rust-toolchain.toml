# Rust toolchain pinned for reproducible builds (ADR-0001).
# Install with `rustup toolchain install` (rustup does not always
# auto-install the active toolchain).
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
