# cargo-about configuration for THIRD-PARTY-LICENSES.txt
# (ADR-0011, docs/plans/0002-phase1-tooling-proposal.md T-2).
# Only the crates linked into the Windows executables are listed.
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace crates themselves are not third-party (publish = false).
private = { ignore = true }
# Every license found in the dependency tree on 2026-11-01. A new license
# makes generation fail, so it is reviewed before it is shipped.
accepted = [
    "Apache-2.0",
    "MIT",
    "Zlib",
    "ISC",
    "BSD-2-Clause",
    "Unicode-3.0",
]

# Why: these crates ship their license files, but cargo-about cannot match
# them to an SPDX text (the MIT text is mixed with other notes), and filled
# in the SPDX template with "<year> <copyright holders>" instead. Point at the
# files explicitly; the checksum makes generation fail if a file changes.
[dpi.clarify]
license = "Apache-2.0 AND MIT"

[[dpi.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a"

[[dpi.clarify.files]]
path = "LICENSE-LIBM-MIT"
license = "MIT"
checksum = "9eff396a99bafd208e7126602420d6864f6066c08b84485a5b032320a9c01997"

[libm.clarify]
license = "MIT"

[[libm.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"
